<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexandru-Vasile Moldovan · Senior Frontend Developer</title>
    <!-- Fallback; the app rewrites it with the current years of experience and language. -->
    <meta name="description" content="Senior Frontend Developer. React, TypeScript and years of experience building regulated web platforms." />
    <meta name="author" content="Alexandru-Vasile Moldovan" />
    <meta name="robots" content="index, follow" />

    <!-- __SITE_URL__ is filled in at build time (build/seo.ts). -->
    <link rel="canonical" href="__SITE_URL__" />
    <link rel="alternate" hreflang="en" href="__SITE_URL__" />
    <link rel="alternate" hreflang="ro" href="__SITE_URL__?lang=ro" />
    <link rel="alternate" hreflang="x-default" href="__SITE_URL__" />
    <link rel="sitemap" type="application/xml" href="sitemap.xml" />

    <!-- How the link looks when shared (LinkedIn, Slack, WhatsApp, X…). -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Alexandru-Vasile Moldovan" />
    <meta property="og:title" content="Alexandru-Vasile Moldovan · Senior Frontend Developer" />
    <meta property="og:description" content="Senior Frontend Developer. React, TypeScript and years of experience building regulated web platforms." />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alexandru-Vasile Moldovan, Senior Frontend Developer" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="ro_RO" />
    <meta property="profile:first_name" content="Alexandru-Vasile" />
    <meta property="profile:last_name" content="Moldovan" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexandru-Vasile Moldovan · Senior Frontend Developer" />
    <meta name="twitter:description" content="Senior Frontend Developer. React, TypeScript and years of experience building regulated web platforms." />
    <meta name="twitter:image" content="__SITE_URL__og-image.png" />

    <!-- The saved or system theme before the page paints, so the pre-rendered
         content doesn't flash light for dark-mode visitors (src/utils/theme.ts). -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
